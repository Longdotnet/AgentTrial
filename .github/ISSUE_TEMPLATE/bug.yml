name: Bug report
description: Report a reproducible AgentTrial defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real credentials or private repository content. For security vulnerabilities, follow SECURITY.md.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use fake/sanitized data only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentTrial version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Node.js version
    validations:
      required: true
