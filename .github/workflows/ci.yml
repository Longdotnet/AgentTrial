name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  quality:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify runtime
        run: node --version

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Quality gate
        run: npm run check

      - name: Doctor smoke test
        run: npm run doctor

  lockfile:
    name: Generate dependency lock evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Print lockfile for bootstrap verification
        shell: bash
        run: |
          echo "AGENTTRIAL_LOCKFILE_BEGIN"
          base64 -w 0 package-lock.json
          echo
          echo "AGENTTRIAL_LOCKFILE_END"
